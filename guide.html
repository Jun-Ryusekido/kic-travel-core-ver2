<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ガイド精算 | KIC Travel Core</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#185FA5;--blue-lt:#E6F1FB;
  --green:#0F6E56;--green-lt:#EAF3DE;
  --amber:#854F0B;--amber-lt:#FAEEDA;
  --red:#A32D2D;--red-lt:#FCEBEB;
  --bg:#F4F3EE;--card:#FFFFFF;--border:#E3E1D9;
  --text:#1F1E1B;--text2:#5F5E5A;--text3:#9B998F;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
.header{background:var(--blue);color:#fff;padding:16px;text-align:center}
.header .logo{font-weight:700;font-size:16px;letter-spacing:1px}
.header .sub{font-size:11px;opacity:.85;margin-top:2px}
.container{max-width:480px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px}
.tour-info{font-size:13px;line-height:1.7}
.tour-info b{color:var(--blue)}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-g{background:var(--green);color:#fff;border-color:var(--green)}
.btn:disabled{opacity:.5}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--text3);font-size:13px;cursor:pointer;margin-bottom:12px}
.upload-area:hover{border-color:var(--blue);color:var(--blue)}
.upload-area input{display:none}
.preview-img{width:100%;border-radius:8px;margin-bottom:12px;display:none}
.reading-status{font-size:12px;color:var(--text3);text-align:center;padding:8px 0;display:none}
.receipt-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.receipt-table th{background:var(--bg);padding:6px 8px;text-align:left;font-size:11px;color:var(--text3)}
.receipt-table td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.receipt-table input,.receipt-table select{width:100%;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:13px;padding:6px 8px;color:var(--text);font-family:inherit}
.receipt-table input:focus,.receipt-table select:focus{outline:none;border-color:var(--blue)}
.receipt-table .num-col{width:32px;text-align:center;font-weight:700;color:var(--blue)}
.item-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.item-row:last-child{border-bottom:none}
.item-row .main{flex:1;min-width:0}
.item-row .cat{color:var(--text3);font-size:10px}
.item-row .amt{font-weight:700;flex:0 0 auto}
.pill{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:600;flex:0 0 auto}
.pill.pending{background:var(--amber-lt);color:var(--amber)}
.pill.approved{background:var(--green-lt);color:#3B6D11}
.pill.rejected{background:#F1EFE8;color:#5F5E5A}
.total-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;padding-top:8px;margin-top:4px;border-top:1px solid var(--border)}
.empty{color:var(--text3);font-size:12px;text-align:center;padding:10px 0}
.error-box{background:var(--red-lt);color:var(--red);padding:16px;border-radius:10px;font-size:13px;text-align:center;margin:20px 12px}
.closed-box{background:var(--amber-lt);color:var(--amber);padding:10px 14px;border-radius:8px;font-size:12px;text-align:center;margin-bottom:14px}
.msg-ok{font-size:12px;color:var(--green);margin-top:8px;display:none;text-align:center}
.msg-err{font-size:12px;color:var(--red);margin-top:8px;display:none;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div class="logo">KIC TRAVEL</div>
  <div class="sub">ガイド精算 入力フォーム</div>
</div>
<div id="app" class="container">
  <div class="empty">読み込み中...</div>
</div>

<script>
const SUPABASE_URL = 'https://nzdygjlnzvtdezslnuoy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Cnloaxzb2Ati8gmCa-1o3Q_t3uy6_mB';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = ['食事代','交通費','駐車場代','高速・有料道路代','入場料・拝観料','ガイド費','その他','自由入力'];

function yen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
function toggleFreeInput(selectId, inputId){
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if(inp) inp.style.display = sel.value==='自由入力' ? 'block' : 'none';
}
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const params = new URLSearchParams(location.search);
const token = params.get('token');
document.getElementById('app').innerHTML = '<div style="padding:16px">token: '+token+'</div>';

let settlement = null;
let booking = null;
let items = [];
let pendingReceipts = [];

async function init(){
  const app = document.getElementById('app');
  if(!token){
    app.innerHTML = '<div class="error-box">URLが正しくありません。担当者から共有されたリンクをご確認ください。</div>';
    return;
  }
  let s, error;
try{
  const res = await sb.from('guide_settlements').select('*').eq('access_token', token).maybeSingle();
  s = res.data; error = res.error;
}catch(e){
  app.innerHTML = '<div class="error-box">接続エラー: '+e.message+'</div>';
  return;
}
  if(error || !s){
app.innerHTML = '<div class="error-box">リンクが見つかりませんでした。担当者にご確認ください。<br><small>'+JSON.stringify(error)+'</small></div>';    return;
  }
  settlement = s;
  const {data: b} = await sb.from('bookings').select('ref_no, tour_name, in_date, out_date').eq('ref_no', s.booking_ref).maybeSingle();
  booking = b || null;
  await reload();
}

async function reload(){
  const {data} = await sb.from('guide_settlement_items').select('*').eq('settlement_id', settlement.id).order('submitted_at',{ascending:true});
  items = data || [];
  render();
}

function render(){
  const app = document.getElementById('app');
  const total = items.filter(it=>it.status!=='rejected').reduce((sum,it)=>sum+Number(it.amount||0),0);
  const closed = settlement.status==='closed';

  const guideList = Array.isArray(settlement.guide_names) && settlement.guide_names.length>0
    ? settlement.guide_names
    : (settlement.guide_name ? [{name: settlement.guide_name, phone: settlement.guide_phone||''}] : []);

  const tourInfoHtml = booking ? `
    <div class="tour-info">
      <div>REF# <b>${escHtml(booking.ref_no)}</b></div>
      ${booking.tour_name ? `<div>${escHtml(booking.tour_name)}</div>` : ''}
      ${(booking.in_date||booking.out_date) ? `<div>${booking.in_date||''} 〜 ${booking.out_date||''}</div>` : ''}
      <div>担当ガイド: <b>${escHtml(guideList.map(g=>g.name).join('・')||'')}</b></div>
    </div>` : `<div class="tour-info">担当ガイド: <b>${escHtml(guideList.map(g=>g.name).join('・')||'')}</b></div>`;

  const formHtml = closed ? '' : `
    <div class="card">
      <div class="card-title">領収書を読み取る</div>
      <div class="upload-area" onclick="document.getElementById('receipt-input').click()">
        <div style="font-size:28px;margin-bottom:6px">📷</div>
        <div>領収書の写真を選択</div>
        <div style="font-size:11px;margin-top:4px">番号を振った領収書をまとめて1枚で撮影してください</div>
<input type="file" id="receipt-input" accept="image/*" multiple onchange="handleReceiptImages(this)">


      </div>
      <img id="preview-img" class="preview-img">
      <div id="reading-status" class="reading-status">AI読み取り中...</div>
      <div id="receipt-result"></div>
    </div>`;

  const itemsHtml = items.length>0 ? items.map(it=>{
    const pillLabel = it.status==='approved' ? '承認済' : it.status==='rejected' ? '却下' : '未確認';
    return `<div class="item-row">
      <div class="main">
        <div>${it.receipt_no ? `<b style="color:var(--blue)">No.${escHtml(it.receipt_no)}</b> ` : ''}<span class="cat">${escHtml(it.category||'')}</span></div>
        <div>${escHtml(it.description||'')}</div>
        ${it.expense_date ? `<div style="font-size:10px;color:var(--text3)">${escHtml(it.expense_date)}</div>` : ''}
      </div>
      <div class="amt">${yen(it.amount)}</div>
      <span class="pill ${it.status}">${pillLabel}</span>
    </div>`;
  }).join('') : '<div class="empty">まだ送信した項目はありません</div>';

  app.innerHTML = `
    <div class="card">${tourInfoHtml}</div>
    ${closed ? '<div class="closed-box">この精算は締め済みです。新しい項目は送信できません。</div>' : ''}
    ${formHtml}
    <div class="card">
      <div class="card-title">送信済みの項目</div>
      ${itemsHtml}
      <div class="total-row"><span>合計</span><span>${yen(total)}</span></div>
    </div>
  `;
}

async function handleReceiptImages(input){
  if(!input.files || !input.files.length) return;
  const files = Array.from(input.files);
  pendingReceipts = [];
  const status = document.getElementById('reading-status');
  const result = document.getElementById('receipt-result');
  status.style.display = 'block';
  result.innerHTML = '';
  for(let i=0; i<files.length; i++){
    const file = files[i];
    status.textContent = files.length>1 ? 'AI読み取り中... ('+(i+1)+'/'+files.length+')' : 'AI読み取り中...';
    try{
      const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
      const response = await fetch('/api/extract-receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:base64,mediaType:file.type})});
      const data = await response.json();
      const text = data.text||'';
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      pendingReceipts = pendingReceipts.concat(parsed);
    }catch(e){ console.error(e); }
  }
  status.style.display='none';
  renderReceiptResult();
}
async function handleReceiptImage(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  const preview = document.getElementById('preview-img');
  const status = document.getElementById('reading-status');
  const result = document.getElementById('receipt-result');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  status.style.display = 'block';
  status.textContent = 'AI読み取り中...';
  result.innerHTML = '';
  try{
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const response = await fetch('/api/extract-receipt',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({imageBase64: base64, mediaType: file.type})
    });
    const data = await response.json();
    const text = data.text || '';
    const clean = text.replace(/```json|```/g,'').trim();
    pendingReceipts = JSON.parse(clean);
    status.style.display = 'none';
    renderReceiptResult();
  }catch(e){
    status.textContent = '読み取りに失敗しました。もう一度お試しください。';
    console.error(e);
  }
}

function renderReceiptResult(){
  const result = document.getElementById('receipt-result');
  if(!pendingReceipts || pendingReceipts.length===0){
    result.innerHTML = '<div class="empty">領収書が読み取れませんでした</div>';
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const cards = pendingReceipts.map((r,i)=>`
    <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)">
      <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px">${r.no ? 'No. '+escHtml(r.no) : String(i+1)+'枚目'}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">日付</div>
          <input type="date" id="pr-date-${i}" value="${r.date||''}" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">内容</div>
          <input type="text" id="pr-desc-${i}" value="${escHtml(r.description||'')}" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">カテゴリ</div>
          <select id="pr-cat-${i}" onchange="toggleFreeInput('pr-cat-'+i,'pr-free-'+i)" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">${CATEGORIES.map(c=>`<option value="${c}" ${(r.category||'その他')===c?'selected':''}>${c}</option>`).join('')}</select><input type="text" id="pr-free-${i}" placeholder="カテゴリを入力" style="display:${(r.category||'その他')==='自由入力'?'block':'none'};width:100%;margin-top:4px;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">金額</div>
          <input type="text" id="pr-amt-${i}" value="${Number(r.amount||0).toLocaleString('ja-JP')}" inputmode="numeric" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:16px;font-weight:700;text-align:right;background:#fff">
        </div>
      </div>
    </div>`).join('');

  result.innerHTML = `
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">日付・内容・カテゴリ・金額を確認・修正してから送信してください</div>
    ${cards}
    <button class="btn btn-g" onclick="submitReceipts()">送信する</button>
    <div class="msg-ok" id="pr-msg-ok">✓ 送信しました</div>
    <div class="msg-err" id="pr-msg-err"></div>
  `;
}

async function submitReceipts(){
  const btn = document.querySelector('#receipt-result .btn-g');
  const okEl = document.getElementById('pr-msg-ok');
  const errEl = document.getElementById('pr-msg-err');
  okEl.style.display='none'; errEl.style.display='none';
  btn.disabled=true; btn.textContent='送信中...';
  try{
    const rows = pendingReceipts.map((r,i)=>({
      settlement_id: settlement.id,
      receipt_no: r.no||null,
      expense_date: document.getElementById('pr-date-'+i)?.value||r.date||null,
      category: (()=>{ const sel=document.getElementById('pr-cat-'+i)?.value; if(sel==='自由入力'){ return document.getElementById('pr-free-'+i)?.value||'その他'; } return sel||'その他'; })(),
      description: document.getElementById('pr-desc-'+i)?.value||r.description||'',
      amount: Number((document.getElementById('pr-amt-'+i)?.value||'0').replace(/,/g,'')),
      guide_name: settlement.guide_name||'',
      status: 'pending'
    }));
    const existingNos = items.map(it=>it.receipt_no).filter(Boolean);
    const dupes = rows.filter(r=>r.receipt_no && existingNos.includes(r.receipt_no));
    if(dupes.length>0){
      throw new Error('領収書No '+dupes.map(d=>d.receipt_no).join(', ')+' は既に送信済みです');
    }
    const {error} = await sb.from('guide_settlement_items').insert(rows);
    if(error) throw error;
    okEl.style.display='block';
    pendingReceipts=[];
    await reload();
  }catch(e){
    errEl.textContent='送信に失敗しました: '+(e.message||e);
    errEl.style.display='block';
    btn.disabled=false;
    btn.textContent='送信する';
  }
}

init();
</script>
</body>
</html>
