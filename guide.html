// guide_settlement_itemsへの書き込みは、セキュリティ移行フェーズ1によりanonロールの
// 直接INSERT/UPDATE/DELETEをRLSで禁止したため、service_role key経由の/api/table-crudを
// 通す。guide.htmlにはログイン機構が無いため、精算リンクのaccess_token(このページの
// URLのtokenパラメータ、すなわち`token`変数)自体をguestTokenとしてサーバー側に送り、
// サーバー側でguide_settlements.access_tokenと突き合わせて認証する
// (index.html側のcurrentUser.tokenによるセッション認証とは別の仕組み)。
async function guideItemsApiCall(action, payload){
  const resp = await fetch('/api/table-crud', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ table:'guide_settlement_items', action, guestToken: token, ...payload })
  });
  let data; try{ data = await resp.json(); }catch(e){ data = {}; }
  if(!resp.ok || data.error) throw new Error(data.error || 'サーバーエラーが発生しました');
  return data;
}

async function updateItemReceiptNo(id, value){
  await guideItemsApiCall('guestUpdateById', { id, fields: {receipt_no: value||null} });
  const item = items.find(it=>it.id===id);
  if(item) item.receipt_no = value||null;
}

        </label>
        <label class="btn" style="display:block;cursor:pointer;text-align:center">
          🖼️ ギャラリーから選択

        <div id="receipt-paste-zone" class="upload-area" tabindex="-1" style="margin-top:8px;margin-bottom:0;padding:14px">📋 ここをクリックしてCtrl+Vで画像を貼り付け（ドラッグ&ドロップも可、PC利用時）</div>
      </div>
      <img id="preview-img" class="preview-img">
      <div id="reading-status" class="reading-status">AI読み取り中...</div>

  const itemsHtml = items.length>0 ? items.map(it=>{
    const pillLabel = it.status==='approved' ? '承認済' : it.status==='rejected' ? '却下' : '未確認';

  const pasteZone = document.getElementById('receipt-paste-zone');

function compressImageGuide(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1800;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleReceiptImages(input){
  if(!input.files || !input.files.length) return;
  await processReceiptFiles(Array.from(input.files));
  input.value = '';
}

function enablePasteUpload(containerEl, onFiles){
  if(!containerEl || containerEl.dataset.pasteBound) return;
  containerEl.dataset.pasteBound = '1';
  if(!containerEl.hasAttribute('tabindex')) containerEl.setAttribute('tabindex','-1');
  containerEl.style.outline = 'none';
  containerEl.addEventListener('paste', (e)=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    const files = [];
    for(const item of items){
      if(item.kind === 'file'){ const f = item.getAsFile(); if(f) files.push(f); }
    }
    if(files.length){ e.preventDefault(); onFiles(files); }
  });
  containerEl.addEventListener('dragover', (e)=>{ e.preventDefault(); containerEl.classList.add('paste-drop-active'); });
  containerEl.addEventListener('dragleave', ()=>{ containerEl.classList.remove('paste-drop-active'); });
  containerEl.addEventListener('drop', (e)=>{
    e.preventDefault();
    containerEl.classList.remove('paste-drop-active');
    const files = e.dataTransfer && e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
    if(files.length) onFiles(files);
  });
}

// 学習キーの正規化。index.html側のnormalizeLearnKeyと同じロジックにすること
// (片方だけ変えるとキーが一致しなくなり学習が効かなくなる)。
function normalizeLearnKey(s){
  return String(s||'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');
}

// レシートOCR結果の各行について、過去に同じ店名(内容欄)で確定されたカテゴリを
// learned_mappings(category='receipt_merchant')から引き、カテゴリ欄の初期選択にする。
// あくまで「選択済みの状態で表示するだけ」で、ガイドは自由に変更できる(自動確定はしない)。
// 参照に失敗した場合は何もしない(OCRの推測カテゴリのまま表示する)。
async function applyLearnedReceiptCategories(receipts){
  try{
    const keys = [...new Set(receipts.map(r=>normalizeLearnKey(r.description)).filter(Boolean))];
    if(!keys.length) return;
    const {data, error} = await sb.from('learned_mappings')
      .select('input_key,confirmed_value,confirmed_count')
      .eq('category','receipt_merchant').in('input_key', keys)
      .order('confirmed_count',{ascending:false});
    if(error || !data || !data.length) return;
    const topByKey = {};
    data.forEach(r=>{ if(!topByKey[r.input_key]) topByKey[r.input_key] = r.confirmed_value; });
    receipts.forEach(r=>{
      const learned = topByKey[normalizeLearnKey(r.description)];
      if(learned){ r.category = learned; r._learned = true; }
    });
  }catch(e){ /* 学習参照の失敗は無視し、通常通り表示する */ }
}

// 送信確定した「店名(内容欄)→カテゴリ」を学習として記録する(ベストエフォート)。
// 書き込みはservice_role専用の/api/table-crud(guestUpsertConfirm、精算リンクの
// access_tokenで認証、categoryはサーバー側でreceipt_merchantに強制)経由で行う。
async function recordReceiptLearnings(rows){
  try{
    const entries = rows
      .map(r=>({inputKey: normalizeLearnKey(r.description), confirmedValue: String(r.category||'').trim()}))
      .filter(e=>e.inputKey && e.confirmedValue);
    if(!entries.length) return;
    const resp = await fetch('/api/table-crud', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ table:'learned_mappings', action:'guestUpsertConfirm', guestToken: token, entries })
    });
    await resp.json().catch(()=>({}));
  }catch(e){ /* 学習の失敗は送信の成否に影響させない */ }
}

async function processReceiptFiles(files){
  if(!files || !files.length) return;
  pendingReceipts = [];
  const status = document.getElementById('reading-status');
  const result = document.getElementById('receipt-result');
  status.style.display = 'block';
  showGlobalOcrBanner();
  result.innerHTML = '';
  const errors = [];
  for(let i=0; i<files.length; i++){
    const file = files[i];
    status.textContent = files.length>1 ? 'AI読み取り中... ('+(i+1)+'/'+files.length+')' : 'AI読み取り中...';
    try{
      const base64 = await compressImageGuide(file);
      const response = await fetch('/api/extract-card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receiptImageBase64:base64,receiptMediaType:'image/jpeg'})});
      if(!response.ok){
        let msg = 'サーバーエラー';
        try{ const errData = await response.json(); msg = errData.error||msg; }catch(_){ msg = `サーバーエラー (${response.status})`; }
        throw new Error(msg);
      }
      const data = await response.json();
      if(data.error){ throw new Error(data.error); }
      const text = data.text || '';
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      pendingReceipts = pendingReceipts.concat(parsed);
    }catch(e){
      console.error(e);
      errors.push(e.message || '不明なエラー');
    }
  }
  if(errors.length){
    status.style.display = 'block';
    status.textContent = errors.length+'件の読み取りに失敗しました: ' + errors[errors.length-1] + ' もう一度お試しください。';
  } else {
    status.style.display='none';
  }
  hideGlobalOcrBanner();
  await applyLearnedReceiptCategories(pendingReceipts);
  renderReceiptResult();
}
async function handleReceiptImage(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  const preview = document.getElementById('preview-img');
  const status = document.getElementById('reading-status');
  const result = document.getElementById('receipt-result');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  status.style.display = 'block';
  showGlobalOcrBanner();
  status.textContent = 'AI読み取り中...';
  result.innerHTML = '';
  try{
    const base64 = await compressImageGuide(file);
    const response = await fetch('/api/extract-card',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({receiptImageBase64: base64, receiptMediaType: 'image/jpeg'})
    });
    if(!response.ok){
      let msg = 'サーバーエラー';
      try{ const errData = await response.json(); msg = errData.error||msg; }catch(_){ msg = `サーバーエラー (${response.status})`; }
      throw new Error(msg);
    }
    const data = await response.json();
    if(data.error){ throw new Error(data.error); }
    const text = data.text || '';
    const clean = text.replace(/```json|```/g,'').trim();
    pendingReceipts = JSON.parse(clean);
    status.style.display = 'none';
    hideGlobalOcrBanner();
    await applyLearnedReceiptCategories(pendingReceipts);
    renderReceiptResult();
  }catch(e){
    status.textContent = '読み取りに失敗しました: ' + (e.message || '不明なエラー') + ' もう一度お試しください。';
    hideGlobalOcrBanner();
    console.error(e);
  }
}

function renderReceiptResult(){
  const result = document.getElementById('receipt-result');
  if(!pendingReceipts || pendingReceipts.length===0){
    result.innerHTML = '<div class="empty">領収書が読み取れませんでした</div>';
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const cards = pendingReceipts.map((r,i)=>{
    const catInList = CATEGORIES.includes(r.category||'');
    const catSelectVal = catInList ? (r.category||'その他') : 'その他（自由入力）';
    const catFreeVal = catInList ? '' : (r.category||'');
    const noVal = guidePrefix && r.no ? guidePrefix + r.no : (r.no||'');
    const noPlaceholder = guidePrefix ? guidePrefix+'1, '+guidePrefix+'2...' : '例: 1, A-3';
    return `
    <div id="pr-card-${i}" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
        <button onclick="removePendingReceipt(${i})" style="background:none;border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--text3);cursor:pointer">削除</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">領収書番号</div>
          <input type="text" id="pr-no-${i}" value="${escHtml(noVal)}" placeholder="${escHtml(noPlaceholder)}" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;font-weight:700;color:var(--blue);background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">日付</div>
          <input type="date" id="pr-date-${i}" value="${r.date||''}" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">内容</div>
          <input type="text" id="pr-desc-${i}" value="${escHtml(r.description||'')}" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">カテゴリ</div>
          <select id="pr-cat-${i}" onchange="toggleFreeInput('pr-cat-${i}','pr-free-${i}')" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">${[...CATEGORIES,'その他（自由入力）'].map(c=>`<option value="${escHtml(c)}" ${catSelectVal===c?'selected':''}>${escHtml(CATEGORY_LABELS[c]||c)}</option>`).join('')}</select>
          <input type="text" id="pr-free-${i}" placeholder="カテゴリを入力" value="${escHtml(catFreeVal)}" style="display:${catSelectVal==='その他（自由入力）'?'block':'none'};width:100%;margin-top:4px;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;background:#fff">
          ${r._learned?'<div style="font-size:10px;color:var(--green,#1B7F3B);margin-top:2px">★ 過去の確定内容から自動選択されています（変更可能）</div>':''}
        </div>
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px">金額</div>
          <input type="text" id="pr-amt-${i}" value="${Number(r.amount||0).toLocaleString('ja-JP')}" inputmode="numeric" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:16px;font-weight:700;text-align:right;background:#fff">
        </div>
      </div>
    </div>`;
  }).join('');

  result.innerHTML = `
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">日付・内容・カテゴリ・金額を確認・修正してから送信してください</div>
    ${cards}
    <button class="btn btn-g" onclick="submitReceipts()">送信する</button>
    <div class="msg-ok" id="pr-msg-ok">✓ 送信しました</div>
    <div class="msg-err" id="pr-msg-err"></div>
  `;
}

function removePendingReceipt(i){
  const card = document.getElementById('pr-card-'+i);
  if(card) card.style.display='none';
}

async function submitReceipts(){
  const btn = document.querySelector('#receipt-result .btn-g');
  const okEl = document.getElementById('pr-msg-ok');
  const errEl = document.getElementById('pr-msg-err');
  okEl.style.display='none'; errEl.style.display='none';
  btn.disabled=true; btn.textContent='送信中...';
  try{
    const rows = pendingReceipts.map((r,i)=>{
      if(document.getElementById('pr-card-'+i)?.style.display==='none') return null;
      return {
        settlement_id: settlement.id,
        receipt_no: document.getElementById('pr-no-'+i)?.value||null,
        expense_date: document.getElementById('pr-date-'+i)?.value||r.date||null,
        category: (()=>{ const sel=document.getElementById('pr-cat-'+i)?.value; return sel==='その他（自由入力）' ? (document.getElementById('pr-free-'+i)?.value||'その他') : (sel||'その他'); })(),
        description: document.getElementById('pr-desc-'+i)?.value||r.description||'',
        amount: Number((document.getElementById('pr-amt-'+i)?.value||'0').replace(/,/g,'')),
        guide_name: settlement.guide_name||'',
        status: 'pending'
      };
    }).filter(Boolean);
    const existingNos = items.map(it=>it.receipt_no).filter(Boolean);
    const dupes = rows.filter(r=>r.receipt_no && existingNos.includes(r.receipt_no));
    if(dupes.length>0){
      throw new Error('領収書No '+dupes.map(d=>d.receipt_no).join(', ')+' は既に送信済みです');
    }
    await guideItemsApiCall('guestInsert', { rows });
    // 送信に成功した行の「店名(内容)→カテゴリ」を学習として記録(失敗しても送信は成立済み)
    await recordReceiptLearnings(rows);
    okEl.style.display='block';
    pendingReceipts=[];
    await reload();
  }catch(e){
    errEl.textContent='送信に失敗しました: '+(e.message||e);
    errEl.style.display='block';
    btn.disabled=false;
    btn.textContent='送信する';
  }
}

init();
</script>
</body>
</html>
